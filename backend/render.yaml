services:
  - type: web
    name: rms-platform-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # You must set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # You must set this manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel frontend URL e.g. https://rms-plateform.vercel.app
